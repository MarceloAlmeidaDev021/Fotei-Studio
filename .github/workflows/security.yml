name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:security
      - run: npm run audit:security
      - run: npm test
      - run: npm run format:check
      - name: Scan secrets in files and Git history
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          cd "$scan_dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" --output checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz"' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scan_dir/gitleaks" dir . --redact --no-banner
          "$scan_dir/gitleaks" git . --redact --no-banner

  codeql:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
